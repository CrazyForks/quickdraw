<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Quickdraw — free online whiteboard</title>
  <meta name="description" content="A free online whiteboard. Draw with pressure ink, shapes, sticky notes, and arrows on an infinite canvas. No account, autosaved in your browser, exports to PNG. Open source." />
  <link rel="canonical" href="https://app.tryquickdraw.com/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Quickdraw — free online whiteboard" />
  <meta property="og:description" content="Draw instantly. No account, autosaved locally, open source." />
  <meta property="og:image" content="https://tryquickdraw.com/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#faf8f4" />
  <style>
    html, body { margin: 0; height: 100%; overscroll-behavior: none; }
    #board { position: fixed; inset: 0; }
    .qd-app-badge {
      position: fixed; left: 12px; bottom: 12px; z-index: 60;
      display: flex; align-items: center; gap: 10px;
      font: 500 12.5px/1 ui-sans-serif, system-ui, sans-serif;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(6px);
      border: 1px solid rgba(0,0,0,0.12); border-radius: 999px;
      padding: 7px 12px; color: #57544c;
    }
    [data-qd-theme="dark"] ~ .qd-app-badge, .qd-app-badge.dark {
      background: rgba(30,30,28,0.92); border-color: rgba(255,255,255,0.14); color: #b9b5aa;
    }
    .qd-app-badge a { color: inherit; text-decoration: none; font-weight: 700; }
    .qd-app-badge a:hover { text-decoration: underline; }
    .qd-app-badge .sep { opacity: 0.4; }
  </style>
</head>
<body>
  <div id="board"></div>
  <div class="qd-app-badge" id="badge">
    <a href="https://tryquickdraw.com" rel="noopener">Quickdraw</a>
    <span class="sep">·</span>
    <span>autosaved locally</span>
    <span class="sep">·</span>
    <a href="https://github.com/nmndwivedi/quickdraw" rel="noopener">open source</a>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
