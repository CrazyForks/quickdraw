<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Quickdraw — free online whiteboard</title>
  <meta name="description" content="A free online whiteboard. Draw with pressure ink, shapes, sticky notes, and arrows on an infinite canvas. No account, autosaved in your browser, exports to PNG. Open source." />
  <link rel="canonical" href="https://app.tryquickdraw.com/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Quickdraw — free online whiteboard" />
  <meta property="og:description" content="Draw instantly. No account, autosaved locally, open source." />
  <meta property="og:image" content="https://tryquickdraw.com/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#faf8f4" />
  <style>
    html, body { margin: 0; height: 100%; overscroll-behavior: none; }
    #board { position: fixed; inset: 0; }
    /* The wordmark — quiet ink on the paper, top left, links home. */
    .qd-app-logo {
      position: fixed; left: 14px; top: 12px; z-index: 60;
      display: flex; align-items: center; gap: 8px;
      font: 700 16px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: -0.01em;
      color: #1c1b18; text-decoration: none;
      padding: 6px 10px; border-radius: 10px;
      -webkit-tap-highlight-color: transparent;
      transition: background 140ms ease, color 140ms ease;
    }
    .qd-app-logo svg { width: 21px; height: 21px; display: block; }
    .qd-app-logo:hover { background: rgba(28, 27, 24, 0.06); }
    .qd-app-logo.dark { color: #f4f2ea; }
    .qd-app-logo.dark:hover { background: rgba(244, 242, 234, 0.08); }
  </style>
</head>
<body>
  <div id="board"></div>
  <a class="qd-app-logo" id="logo" href="https://tryquickdraw.com" rel="noopener" aria-label="Quickdraw home">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M6 22 C6 12, 12 6, 20 7 C27 8, 28 16, 22 19 C17 21.5, 12 20, 13 15" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      <circle cx="25.5" cy="25.5" r="3" fill="currentColor"/>
    </svg>
    Quickdraw
  </a>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
